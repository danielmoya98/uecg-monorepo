name: Deploy API to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-render-api.yml'
  workflow_dispatch:

jobs:
  deploy-api:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not configured in repository secrets."
            exit 1
          fi
          echo "Triggering deploy hook on Render..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy triggered successfully!"
