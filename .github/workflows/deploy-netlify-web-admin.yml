name: Deploy Web Admin to Netlify

on:
  push:
    branches: [ main ]
    paths:
      - 'web-admin/**'
      - '.github/workflows/deploy-netlify-web-admin.yml'
  workflow_dispatch:

jobs:
  deploy-web-admin:
    name: Build & Deploy Web Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: ./web-admin
        run: npm ci

      - name: Build Web Admin
        working-directory: ./web-admin
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_WEB_ADMIN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID_WEB_ADMIN secret is missing."
            exit 1
          fi
          npx netlify-cli deploy --prod --dir=web-admin/dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
